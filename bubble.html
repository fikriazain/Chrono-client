<!-- bubble.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --ink: #05030f; --deep: #0a0620; --cobalt: #2f6bff; --ice: #8fc4ff;
    --pink: #ff2bd6; --cyan: #00f0ff; --eye: #ffe83a;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'Bahnschrift', 'Segoe UI', Consolas, sans-serif; color: #eaf1ff; }

  #pop { position: absolute; inset: 0; opacity: 0; transform-origin: 80% 94%; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ghost { opacity: 0; mix-blend-mode: screen; }

  #ui { position: absolute; left: 32px; top: 26px; width: 316px; height: 166px; display: flex; flex-direction: column; }
  #head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--ice); letter-spacing: .5px; }
  #head i { width: 9px; height: 9px; background: var(--eye); transform: rotate(45deg); box-shadow: 0 0 8px var(--eye); }
  #x { margin-left: auto; width: 22px; height: 22px; border: 0; background: none; color: var(--pink); font-size: 18px; line-height: 20px; cursor: pointer; padding: 0; }
  #x:hover { color: #fff; text-shadow: -2px 0 var(--cyan), 2px 0 var(--pink); }

  #msg { flex: 1; margin-top: 6px; font-size: 15px; line-height: 1.35; overflow: hidden;
         text-shadow: -1.5px 0 rgba(0,240,255,.7), 1.5px 0 rgba(255,43,214,.7); }
  #msg::after { content: ''; display: inline-block; width: 8px; height: 15px; margin-left: 3px; vertical-align: -2px;
                background: var(--pink); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #row { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--cobalt); padding-bottom: 3px; }
  #row b { color: var(--pink); font-size: 16px; }
  #in { flex: 1; background: transparent; border: 0; outline: 0; color: #fff; font: inherit; font-size: 14px; caret-color: var(--pink); }
  #in::placeholder { color: rgba(143,196,255,.5); }
</style>
</head>
<body>
<div id="pop">
  <svg viewBox="0 0 400 290">
    <defs>
      <path id="shape" d="M38,14 H340 Q364,14 364,38 V180 Q364,204 340,204 H292 L322,272 L228,204 H38 Q14,204 14,180 V38 Q14,14 38,14 Z"/>
      <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-58)">
        <rect width="9" height="9" fill="#0a0620"/><rect width="4" height="9" fill="#ff2bd6"/>
      </pattern>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0830"/><stop offset="1" stop-color="#05030f"/>
      </linearGradient>
      <clipPath id="clip"><use href="#shape"/></clipPath>
    </defs>
    <use href="#shape" transform="translate(11,11)" fill="url(#hatch)" stroke="#2f6bff" stroke-width="3" stroke-linejoin="round"/>
    <use href="#shape" fill="url(#body)" stroke="#2f6bff" stroke-width="4" stroke-linejoin="round"/>
    <g clip-path="url(#clip)">  <!-- low-poly facets, like the wings -->
      <polygon points="14,14 120,14 14,96" fill="#2f6bff" opacity=".22"/>
      <polygon points="14,14 70,14 14,50" fill="#00f0ff" opacity=".18"/>
      <polygon points="364,204 250,204 364,120" fill="#2f6bff" opacity=".2"/>
      <polygon points="364,204 330,204 364,168" fill="#ff2bd6" opacity=".5"/>
      <polygon points="364,14 340,14 364,44" fill="#ff2bd6" opacity=".35"/>
    </g>
  </svg>
  <svg class="ghost" id="g1" viewBox="0 0 400 290"><use href="#shape" fill="none" stroke="#00f0ff" stroke-width="3"/></svg>
  <svg class="ghost" id="g2" viewBox="0 0 400 290"><use href="#shape" fill="none" stroke="#ff2bd6" stroke-width="3"/></svg>

  <div id="ui">
    <div id="head"><i></i><span>Chrono</span><button id="x" title="Close">×</button></div>
    <div id="msg"></div>
    <div id="row"><b>›</b><input id="in" placeholder="say something..." autocomplete="off" spellcheck="false" /></div>
  </div>
</div>
<script src="bubble.js"></script>
</body>
</html>
